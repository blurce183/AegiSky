<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.6" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#5c2c06"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="150" cy="110" r="56" fill="#fef9c3"/>

  <!-- nuvole -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="560" y="120" width="240" height="30" rx="15"/><rect x="620" y="94" width="130" height="30" rx="15"/>
    <rect x="60" y="480" width="260" height="34" rx="17"/><rect x="120" y="452" width="150" height="34" rx="17"/>
    <rect x="600" y="520" width="240" height="34" rx="17"/><rect x="660" y="492" width="140" height="34" rx="17"/>
    <rect x="330" y="560" width="240" height="30" rx="15"/>
  </g>

  <!-- isola principale -->
  <g>
    <rect x="180" y="260" width="540" height="50" fill="url(#grass)"/>
    <rect x="180" y="260" width="540" height="14" fill="#86efac"/>
    <rect x="220" y="310" width="460" height="80" fill="url(#dirt)"/>
    <rect x="300" y="390" width="300" height="60" fill="#5c2c06"/>
    <rect x="380" y="450" width="140" height="36" fill="#431a04"/>

    <!-- casa -->
    <g>
      <rect x="240" y="170" width="140" height="90" fill="#a16207"/>
      <rect x="226" y="136" width="168" height="36" fill="#7c2d12"/>
      <rect x="280" y="196" width="44" height="64" fill="#5c2c06"/>
      <rect x="340" y="192" width="32" height="32" fill="#fbbf24"/>
    </g>

    <!-- albero -->
    <g>
      <rect x="620" y="190" width="20" height="70" fill="#713f12"/>
      <rect x="592" y="150" width="76" height="20" fill="#22c55e"/>
      <rect x="604" y="130" width="52" height="20" fill="#4ade80"/>
    </g>

    <!-- farm -->
    <g>
      <rect x="420" y="228" width="180" height="32" fill="#713f12"/>
      <rect x="420" y="228" width="180" height="10" fill="#78350f"/>
      <rect x="432" y="212" width="12" height="16" fill="#facc15"/>
      <rect x="476" y="212" width="12" height="16" fill="#4ade80"/>
      <rect x="520" y="212" width="12" height="16" fill="#f97316"/>
      <rect x="564" y="212" width="12" height="16" fill="#facc15"/>
    </g>

    <!-- generatore cobblestone -->
    <g>
      <rect x="470" y="316" width="60" height="40" fill="#94a3b8"/>
      <rect x="470" y="316" width="60" height="12" fill="#cbd5e1"/>
      <rect x="540" y="330" width="14" height="26" fill="#38bdf8"/>
    </g>

    <!-- cascatella -->
    <rect x="676" y="310" width="22" height="130" fill="#38bdf8" opacity="0.9"/>

    <!-- minions -->
    <g>
      <rect x="330" y="336" width="30" height="30" fill="#fbbf24"/>
      <rect x="336" y="342" width="6" height="6" fill="#1e293b"/>
      <rect x="348" y="342" width="6" height="6" fill="#1e293b"/>
      <rect x="356" y="330" width="10" height="10" fill="#f59e0b"/>
    </g>
  </g>

  <!-- piccole isole satelliti -->
  <g>
    <rect x="60" y="300" width="110" height="22" fill="url(#grass)"/>
    <rect x="76" y="322" width="78" height="30" fill="url(#dirt)"/>
    <rect x="740" y="380" width="120" height="22" fill="url(#grass)"/>
    <rect x="756" y="402" width="88" height="30" fill="url(#dirt)"/>
    <rect x="770" y="330" width="14" height="50" fill="#713f12"/>
    <rect x="752" y="300" width="50" height="16" fill="#22c55e"/>
  </g>
</svg>
