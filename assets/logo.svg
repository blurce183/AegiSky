<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#12224a"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#5c2c06"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- stelle -->
  <g fill="#e0f2fe" opacity="0.8">
    <rect x="90" y="90" width="6" height="6"/>
    <rect x="380" y="70" width="6" height="6"/>
    <rect x="430" y="150" width="5" height="5"/>
    <rect x="60" y="200" width="5" height="5"/>
    <rect x="320" y="120" width="4" height="4"/>
  </g>

  <!-- portale luminoso -->
  <g>
    <rect x="196" y="96" width="120" height="120" rx="18" fill="url(#portal)" opacity="0.95"/>
    <rect x="196" y="96" width="120" height="120" rx="18" fill="none" stroke="#bae6fd" stroke-width="8"/>
    <rect x="226" y="126" width="60" height="60" fill="#e0f2fe" opacity="0.55"/>
  </g>

  <!-- isola voxel -->
  <g>
    <rect x="128" y="272" width="256" height="40" fill="url(#grass)"/>
    <rect x="128" y="272" width="256" height="10" fill="#86efac"/>
    <rect x="144" y="312" width="224" height="48" fill="url(#dirt)"/>
    <rect x="176" y="360" width="160" height="40" fill="#5c2c06"/>
    <rect x="208" y="400" width="96" height="28" fill="#431a04"/>
    <rect x="232" y="428" width="48" height="16" fill="#331300"/>
  </g>

  <!-- albero -->
  <g>
    <rect x="236" y="216" width="16" height="56" fill="#713f12"/>
    <rect x="212" y="184" width="64" height="16" fill="#22c55e"/>
    <rect x="220" y="168" width="48" height="16" fill="#4ade80"/>
    <rect x="228" y="152" width="32" height="16" fill="#86efac"/>
  </g>

  <!-- cascatella -->
  <rect x="344" y="312" width="20" height="90" fill="#38bdf8" opacity="0.85"/>
  <rect x="344" y="312" width="20" height="90" fill="none"/>

  <!-- nuvolette -->
  <g fill="#e2e8f0" opacity="0.9">
    <rect x="70" y="330" width="60" height="14" rx="7"/>
    <rect x="86" y="316" width="36" height="14" rx="7"/>
    <rect x="392" y="290" width="56" height="14" rx="7"/>
    <rect x="406" y="276" width="32" height="14" rx="7"/>
  </g>
</svg>
