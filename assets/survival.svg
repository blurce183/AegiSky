<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#5c2c06"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="760" cy="110" r="60" fill="#fde68a"/>
  <circle cx="760" cy="110" r="86" fill="#fde68a" opacity="0.3"/>

  <g fill="#ffffff" opacity="0.9">
    <rect x="80" y="110" width="180" height="26" rx="13"/><rect x="120" y="88" width="100" height="26" rx="13"/>
    <rect x="480" y="70" width="160" height="24" rx="12"/><rect x="510" y="50" width="90" height="24" rx="12"/>
  </g>

  <!-- montagne di fondo -->
  <g fill="#64748b">
    <rect x="0" y="300" width="200" height="300"/>
    <rect x="40" y="240" width="120" height="60"/>
    <rect x="680" y="280" width="220" height="320"/>
    <rect x="720" y="220" width="140" height="60"/>
  </g>
  <g fill="#94a3b8">
    <rect x="60" y="240" width="80" height="20"/>
    <rect x="740" y="220" width="100" height="20"/>
  </g>

  <!-- terreno -->
  <rect x="0" y="440" width="900" height="60" fill="url(#grass)"/>
  <rect x="0" y="440" width="900" height="14" fill="#86efac"/>
  <rect x="0" y="500" width="900" height="100" fill="url(#dirt)"/>

  <!-- case -->
  <g>
    <rect x="120" y="330" width="180" height="110" fill="#a16207"/>
    <rect x="100" y="290" width="220" height="44" fill="#7c2d12"/>
    <rect x="150" y="360" width="50" height="80" fill="#5c2c06"/>
    <rect x="230" y="360" width="44" height="44" fill="#fbbf24"/>
    <rect x="230" y="360" width="44" height="44" fill="none" stroke="#713f12" stroke-width="6"/>
  </g>
  <g>
    <rect x="560" y="350" width="150" height="90" fill="#a16207"/>
    <rect x="544" y="316" width="182" height="38" fill="#7c2d12"/>
    <rect x="600" y="376" width="44" height="64" fill="#5c2c06"/>
    <rect x="668" y="376" width="36" height="36" fill="#fbbf24"/>
  </g>

  <!-- alberi -->
  <g>
    <rect x="380" y="360" width="20" height="80" fill="#713f12"/>
    <rect x="350" y="316" width="80" height="22" fill="#22c55e"/>
    <rect x="362" y="294" width="56" height="22" fill="#4ade80"/>
    <rect x="820" y="370" width="18" height="70" fill="#713f12"/>
    <rect x="794" y="330" width="70" height="20" fill="#22c55e"/>
    <rect x="806" y="312" width="46" height="18" fill="#4ade80"/>
    <rect x="40" y="380" width="16" height="60" fill="#713f12"/>
    <rect x="18" y="344" width="60" height="18" fill="#22c55e"/>
  </g>

  <!-- fattoria -->
  <g>
    <rect x="330" y="470" width="220" height="14" fill="#713f12"/>
    <rect x="330" y="484" width="14" height="60" fill="#713f12"/>
    <rect x="536" y="484" width="14" height="60" fill="#713f12"/>
    <rect x="356" y="498" width="40" height="40" fill="#facc15"/>
    <rect x="410" y="498" width="40" height="40" fill="#f97316"/>
    <rect x="464" y="498" width="40" height="40" fill="#facc15"/>
  </g>

  <!-- torce -->
  <g>
    <rect x="110" y="410" width="8" height="30" fill="#713f12"/>
    <rect x="108" y="400" width="12" height="12" fill="#fbbf24"/>
    <rect x="540" y="420" width="8" height="24" fill="#713f12"/>
    <rect x="538" y="410" width="12" height="12" fill="#fbbf24"/>
  </g>
</svg>
