<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.45" stop-color="#1e3a8a"/>
      <stop offset="0.75" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#5c2c06"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="640" r="260" fill="url(#sun)"/>

  <!-- stelle -->
  <g fill="#e0f2fe" opacity="0.7">
    <rect x="120" y="90" width="5" height="5"/><rect x="300" y="150" width="4" height="4"/>
    <rect x="520" y="70" width="5" height="5"/><rect x="760" y="120" width="4" height="4"/>
    <rect x="980" y="80" width="5" height="5"/><rect x="1200" y="140" width="4" height="4"/>
    <rect x="1420" y="100" width="5" height="5"/><rect x="200" y="240" width="4" height="4"/>
    <rect x="1360" y="260" width="4" height="4"/>
  </g>

  <!-- nuvole -->
  <g fill="#e2e8f0" opacity="0.85">
    <rect x="140" y="560" width="220" height="34" rx="17"/><rect x="190" y="528" width="130" height="34" rx="17"/>
    <rect x="1240" y="600" width="240" height="36" rx="18"/><rect x="1300" y="566" width="140" height="36" rx="17"/>
    <rect x="620" y="720" width="360" height="40" rx="20"/><rect x="700" y="682" width="200" height="40" rx="20"/>
  </g>

  <!-- isola grande sinistra -->
  <g>
    <rect x="120" y="380" width="420" height="46" fill="url(#grass)"/>
    <rect x="120" y="380" width="420" height="12" fill="#86efac"/>
    <rect x="150" y="426" width="360" height="70" fill="url(#dirt)"/>
    <rect x="210" y="496" width="240" height="56" fill="#5c2c06"/>
    <rect x="270" y="552" width="120" height="34" fill="#431a04"/>
    <!-- alberi -->
    <g>
      <rect x="200" y="300" width="20" height="80" fill="#713f12"/>
      <rect x="170" y="260" width="80" height="22" fill="#22c55e"/>
      <rect x="182" y="238" width="56" height="22" fill="#4ade80"/>
      <rect x="420" y="310" width="18" height="70" fill="#713f12"/>
      <rect x="394" y="274" width="70" height="20" fill="#22c55e"/>
      <rect x="404" y="254" width="50" height="20" fill="#4ade80"/>
    </g>
    <!-- cascatella -->
    <rect x="470" y="426" width="24" height="150" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- isola destra -->
  <g>
    <rect x="1080" y="300" width="360" height="42" fill="url(#grass)"/>
    <rect x="1080" y="300" width="360" height="12" fill="#86efac"/>
    <rect x="1110" y="342" width="300" height="60" fill="url(#dirt)"/>
    <rect x="1170" y="402" width="180" height="46" fill="#5c2c06"/>
    <rect x="1230" y="448" width="80" height="26" fill="#431a04"/>
    <g>
      <rect x="1140" y="228" width="18" height="72" fill="#713f12"/>
      <rect x="1112" y="192" width="74" height="20" fill="#22c55e"/>
      <rect x="1124" y="172" width="50" height="20" fill="#4ade80"/>
      <rect x="1330" y="236" width="16" height="64" fill="#713f12"/>
      <rect x="1306" y="204" width="64" height="18" fill="#22c55e"/>
      <rect x="1316" y="186" width="44" height="18" fill="#4ade80"/>
    </g>
  </g>

  <!-- piccola isola centrale -->
  <g>
    <rect x="700" y="240" width="200" height="34" fill="url(#grass)"/>
    <rect x="700" y="240" width="200" height="10" fill="#86efac"/>
    <rect x="724" y="274" width="152" height="44" fill="url(#stone)"/>
    <rect x="768" y="318" width="64" height="26" fill="#334155"/>
    <rect x="770" y="180" width="16" height="60" fill="#713f12"/>
    <rect x="748" y="150" width="60" height="18" fill="#22c55e"/>
    <rect x="758" y="132" width="40" height="18" fill="#4ade80"/>
  </g>
</svg>
